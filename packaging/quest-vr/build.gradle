// OpenJKDF2 VR - Quest 3 Build Configuration
// Open this folder in Android Studio to build

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.application'

android {
    namespace "org.openjkdf2.vr"
    compileSdk 34
    ndkVersion "26.1.10909125"  // Compatible with AGP 8.2

    // Enable native debugging
    packagingOptions {
        doNotStrip "**/*.so"
    }

    defaultConfig {
        applicationId "org.openjkdf2.vr"
        minSdk 29  // Quest 2/3 minimum
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments "-DPLAT_ANDROID_ARM64=TRUE",
                          "-DTARGET_USE_VR=TRUE",
                          "-DTARGET_USE_FFMPEG=TRUE",
                          "-DANDROID_STL=c++_shared",
                          "-DANDROID_PLATFORM=android-29"
                cppFlags "-std=c++17 -fexceptions"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Release"
                    cppFlags "-O2"
                    cFlags "-O2"
                }
            }
        }
        debug {
            debuggable true
            jniDebuggable true
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Debug",
                              "-DANDROID_ARM_MODE=arm",
                              "-DCMAKE_C_FLAGS_DEBUG=-O0 -g -DDEBUG -fno-omit-frame-pointer -fno-limit-debug-info",
                              "-DCMAKE_CXX_FLAGS_DEBUG=-O0 -g -DDEBUG -fno-omit-frame-pointer -fno-limit-debug-info"
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"  // Point to root CMakeLists.txt
            version "3.22.1+"
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src/main/java', '../android-project/app/src/main/java']
            res.srcDirs = ['src/main/res']
            assets.srcDirs = ['assets']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}

// Task to copy game assets to APK
task copyShaders(type: Copy) {
    from '../../resource/shaders'
    into 'assets/shaders'
}

task copySSL(type: Copy) {
    from '../../resource/ssl'
    into 'assets/ssl'
}

task copyUI(type: Copy) {
    from '../../resource/ui'
    into 'assets/ui'
}

preBuild.dependsOn copyShaders, copySSL, copyUI
